<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" fill="none" role="img" aria-labelledby="graphite-title graphite-desc">
  <title id="graphite-title">Graphite, the plan maker</title>
  <desc id="graphite-desc">A sharpened coral pencil with a confident smile, paper gloves and sturdy little boots. Graphite holds a rolled island plan, ready to turn an idea into something useful.</desc>
