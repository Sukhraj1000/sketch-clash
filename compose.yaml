# Full stack in Docker: http://127.0.0.1:8080
#   docker compose up --build -d      (npm run docker:up)
# Only the web port is published, and only on 127.0.0.1, so nothing is reachable from the
# network. Secrets are read from .env.local at run time. Both containers run with a
# read-only filesystem, no Linux capabilities beyond what nginx needs, and no privilege
# escalation; restart: unless-stopped brings them back whenever Docker Desktop starts.
name: sketch-clash

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *hardening
    build:
      context: .
      target: api
    env_file:
      - path: .env.local
        required: false
    environment:
      FRONTEND_ORIGIN: http://127.0.0.1:8080
      # Trust X-Forwarded-For from the nginx container so operator rate limits see the real client.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # The same folder npm run dev uses, so one operator key works for both
      # (npm run operator:token prints it). It is the only place the backend writes.
      - ./backend/data:/app/backend/data
    tmpfs:
      - /tmp
    mem_limit: 4g

  web:
    <<: *hardening
    build:
      context: .
      target: web
    # nginx's master process binds port 80 and hands workers to the unprivileged nginx user.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /run
    mem_limit: 256m
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
